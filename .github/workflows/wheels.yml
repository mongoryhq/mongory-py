name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish built artifacts to PyPI (requires Trusted Publisher)"
        required: false
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Wheels (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: "x86_64 arm64"
          - os: windows-latest
            arch: AMD64

    steps:
      - name: Checkout mongory-py (with mongory-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout mongory-spec for wheel test suite
        uses: actions/checkout@v4
        with:
          repository: mongoryhq/mongory-spec
          ref: 8ec15676f3a7d0d6b3b4e5d049341f9bf803c03b
          path: mongory-spec

      - name: Build and test wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.0.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT_PASS_LINUX: MONGORY_SPEC_DIR
          CIBW_TEST_COMMAND: "python -m unittest discover -s {project}/tests -v"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ runner.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mongory-py (with mongory-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and verify installation from sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
          python -m pip install dist/*.tar.gz
          python -c "import mongory; from mongory import op; assert mongory.match({'a': {op.GTE: 1}}, {'a': 2})"

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mongory
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download all built wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
